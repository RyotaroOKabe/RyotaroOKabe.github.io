# Bio supports Markdown (links, bold, etc.)
bio: >-
  I am a Ph.D. candidate in Chemistry at MIT, advised by
  [Prof. Mingda Li](https://qm.mit.edu/) in the Quantum Measurement Group.
  My research develops physics-informed machine learning methods for quantum
  materials discovery and design, spanning generative models, graph neural
  networks, and LLM-guided synthesis prediction. Before MIT, I received my
  M.S. and B.S. from the Institute of Science Tokyo and conducted research
  internships at IBM Research, Yale, and Rice.

