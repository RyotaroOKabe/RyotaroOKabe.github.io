{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item">
            <button id="theme-toggle" aria-label="Toggle theme" style="background: none; border: none; padding: 0.5rem; cursor: pointer; color: var(--primary-color); font-size: 1rem; transition: color 0.2s; display: inline-flex; align-items: center;">
              <i class="fas fa-moon" id="theme-icon"></i>
            </button>
          </li>
        </ul>
        <script>
          (function() {
            var themeToggle = document.getElementById("theme-toggle");
            var themeIcon = document.getElementById("theme-icon");
            if (!themeToggle || !themeIcon) return;
            
            function updateIcon(theme) {
              if (theme === "dark") {
                themeIcon.className = "fas fa-sun";
              } else {
                themeIcon.className = "fas fa-moon";
              }
            }
            
            var currentTheme = document.documentElement.getAttribute("data-theme") || "light";
            updateIcon(currentTheme);
            
            themeToggle.addEventListener("click", function() {
              var newTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
              document.documentElement.setAttribute("data-theme", newTheme);
              localStorage.setItem("theme", newTheme);
              updateIcon(newTheme);
            });
          })();
        </script>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
