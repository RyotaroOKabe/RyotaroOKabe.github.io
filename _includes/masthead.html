{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <i class="fas fa-moon" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

<script>
  (function() {
    var toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    var icon = toggle.querySelector('i');
    var mq = window.matchMedia('(prefers-color-scheme: dark)');

    function effectiveTheme() {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'light' || attr === 'dark') return attr;
      return mq.matches ? 'dark' : 'light';
    }

    function render() {
      var dark = effectiveTheme() === 'dark';
      icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
      var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
    }

    toggle.addEventListener('click', function() {
      var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      render();
    });

    // Keep icon/label in sync with OS changes while in auto mode
    if (mq.addEventListener) { mq.addEventListener('change', render); }
    else if (mq.addListener) { mq.addListener(render); }
    render();
  })();
</script>
